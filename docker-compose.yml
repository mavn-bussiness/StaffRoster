name: staffroster

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: staffroster/app:latest
    container_name: staffroster-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - storage-data:/var/www/html/storage/app
      - storage-logs:/var/www/html/storage/logs
      - storage-framework:/var/www/html/storage/framework
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/up"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  db:
    image: postgres:18-alpine
    container_name: staffroster-db
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  postgres-data:
  storage-data:
  storage-logs:
  storage-framework:
